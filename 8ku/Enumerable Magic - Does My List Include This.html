<h1>Create a method that accepts a list and an item, and returns true if the item belongs to the list, otherwise false.</h1>

<script>
    let arr = [1,3,5,6,7,9]
    function include(arr, item){
        // for(let i = 0; i < arr.length; i++){
        //     if(item === arr[i]) return true
        // }
        // return false
        let result = arr.find(num => num === item)
        if (result === undefined) return false
        if (typeof result === 'number') return true

    }
    let result = include(arr, 17)
    console.log(result)
</script>
