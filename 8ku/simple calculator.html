<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<script>


    function calculator(a,b,sign){
        // Your code here...

        if(typeof a !== 'number' || typeof b !== 'number')
            return "unknown value"
        let result
        switch(sign) {
            case '+':
                result = a + b
                break
            case '-':
                result = a - b
                break
            case '*':
                result = a * b
                break
            case '/':
                result = a / b
                break
            default:
                return 'unknown value'
        }

        return result
    }

    console.log(calculator(4, 6, '-'))
</script>
</body>
</html>
